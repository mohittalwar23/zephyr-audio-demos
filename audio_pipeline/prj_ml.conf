# ML-specific overrides
# TFLM arenas eat RAM so heap must stay small

# 50 delay blocks × ~284 bytes = ~14KB + TFLM arenas ~28KB + headroom
CONFIG_HEAP_MEM_POOL_SIZE=49152

# C++ required for model_runner.cpp
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_TENSORFLOW_LITE_MICRO=y

CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=2
